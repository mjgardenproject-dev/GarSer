[functions.booking-authority]
verify_jwt = false

[functions.booking-payment]
verify_jwt = false

[functions.booking-payment-webhook]
verify_jwt = false

[functions.booking-telemetry]
verify_jwt = false

# Invocada internamente por booking-payment-webhook con la clave de servicio. Con
# verify_jwt=true el gateway rechazaba la llamada con 401 ANTES de ejecutar la funcion
# cuando el proyecto usa las claves modernas (sb_secret_...), que no son JWT: los emails
# de reserva no se enviaban nunca y el fallo era invisible. La funcion valida por si misma
# que el llamante presenta la clave de servicio (requireInternalServiceAuth).
[functions.booking-confirmation-email]
verify_jwt = false

# --------------------------------------------------------------------------------------
# Las cuatro de abajo NO estaban declaradas, asi que al desplegarlas recibian el
# verify_jwt=true por defecto y el gateway las rechazaba con 401 ANTES de ejecutarlas
# (mismo fallo que dejo los emails de reserva sin enviarse durante semanas: con las claves
# modernas `sb_secret_...`, que no son JWT, el gateway no las acepta).
#
# Esto NO afloja la seguridad: cada una valida al llamante por si misma, que es donde debe
# estar la puerta. Se anotan aqui una por una para que quede explicito.
# --------------------------------------------------------------------------------------

# Exige un USUARIO real (la clave anon es publica: tenerla no es identidad) y aplica cuota
# por usuario antes de llamar a Gemini. Ver resolveCallerUserId + consume_ai_pricing_quota.
[functions.ai-pricing-estimator]
verify_jwt = false

# La invoca booking-payment con la clave de servicio para el email de cancelacion: con
# verify_jwt=true ese aviso se perdia en silencio. Valida internamente que el llamante sea
# un servicio interno, un admin, o parte de la reserva.
[functions.send-email-notification]
verify_jwt = false

# Capa de compatibilidad retroactiva: delega en la RPC mark_gardener_finished, que valida
# propietario y ventana por su cuenta. Ya no completa ninguna reserva -ver el comentario de
# cabecera del propio index.ts-.
[functions.booking-complete]
verify_jwt = false

# Valida al usuario por su cuenta (admin.auth.getUser).
[functions.booking-manual-declaration]
verify_jwt = false

# El reloj del ciclo de vida. La llama pg_cron por HTTP con un secreto DEDICADO
# (`x-lifecycle-secret`), no con la clave de servicio: si ese secreto se filtrara, lo unico que
# permite es disparar el tick, que es idempotente. La funcion valida ese secreto por si misma.
[functions.booking-lifecycle-tick]
verify_jwt = false

# Endpoint publico del enlace de un clic. Sin sesion a proposito: valida un token de un solo
# uso hasheado, y confirmar no mueve dinero (los gastos de gestion ya se capturaron antes).
[functions.booking-confirm-service]
verify_jwt = false
