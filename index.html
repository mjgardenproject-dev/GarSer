<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reserva servicios de jardinería a domicilio: indica tu dirección y te mostramos el precio y los jardineros que llegan hasta tu jardín. Empezamos por la Costa del Sol."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GarSer | Jardinería en Costa del Sol" />
    <meta
      property="og:description"
      content="Reserva servicios de jardinería a domicilio: precio y jardineros disponibles según tu dirección. Empezamos por la Costa del Sol."
    />
    <meta property="og:image" content="https://garser.es/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GarSer | Jardinería en Costa del Sol</title>

    <!-- PWA: icono, manifest y modo standalone (auditoría UX móvil 2026-09-14, Fase 2) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GarSer">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Verificación del dominio garser.es en Meta (portafolio empresarial). Va en el HTML estático, no inyectada por
         JavaScript, para que Meta la encuentre al leer la página. No quitar: si falta, Meta pierde la verificación. -->
    <meta name="facebook-domain-verification" content="ymtdrj9m6st3ihwcs6a7mtoibzfz0o" />
    <!-- Recargar empieza arriba: sin esto el móvil restaura el scroll cuando la pantalla (carga en diferido) ya existe y la
         deja a medias, con su primera sección tapada por las barras fijas. Va aquí para que actúe antes que la app;
         src/main.tsx lo repite. ScrollToTop decide dónde empieza cada pantalla. -->
    <script>try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
